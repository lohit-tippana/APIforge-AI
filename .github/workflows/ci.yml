name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apiforge_test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API deps
        run: npm install --prefix apps/api --no-audit --no-fund
      - name: Migrate
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma || npx prisma db push --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/apiforge_test
      - name: Typecheck + unit tests
        run: |
          npx tsc --noEmit -p apps/api
          npm run test -w apps/api
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/apiforge_test
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web deps
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Lint + typecheck + build
        run: |
          npx eslint apps/web/src
          npx tsc --noEmit -p apps/web
          npm run build --prefix apps/web
