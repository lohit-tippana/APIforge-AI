services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: apiforge
      MYSQL_DATABASE: apiforge
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-papiforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: mysql://root:apiforge@db:3306/apiforge
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
      PORT: 4000
    env_file:
      - ./apps/api/.env
    ports:
      - "4000:4000"

volumes:
  db-data:
  redis-data:
